<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Child and Sibling Combinators</title>
    <link href="styles.css" rel="stylesheet" type="text/css">
</head>
<body>
    <main class="parent">
        <p>This is class "parent"</p>
        <div class="child group1">
            <p>This is class "child group1"</p>
            <div class="grand-child group1">
                <p>This is class "grand-child group1"</p>
            </div>   
        </div>
        <div class="child group2">
            <p>This is class "child group2"</p>
            <div class="grand-child group2">
                <p>This is class "grand-child group2"</p>
            </div> 
        </div>
        <div class="child group3">
            <p>This is class "child group3"</p>
            <div class="grand-child group3">
                <p>This is class "grand-child group3"</p>
            </div>
        </div>
    </main>
</body>
</html>
